<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Progress Reach-Time Calculator</title>
<style>
  :root {
    --bg: #0F1115;
    --panel: #161922;
    --panel-border: #262B38;
    --track: #20242F;
    --text: #E8EAED;
    --text-dim: #8B93A1;
    --text-faint: #5A6070;
    --accent: #4FD1C5;
    --target: #F2B84B;
    --sans: -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    font-family: var(--sans);
  }
  .panel {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 32px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    margin: 0;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-dim);
    margin: 4px 0 28px 0;
    line-height: 1.5;
  }
  .field { display: block; margin-bottom: 20px; }
  .field-label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .input-wrap { position: relative; }
  input {
    width: 100%;
    background: var(--track);
    color: var(--text);
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: var(--mono);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .pct-sign {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    color: var(--text-faint);
    font-family: var(--mono);
    pointer-events: none;
  }
  .pct-input { padding-right: 30px; }

  .bar-wrap { margin-top: 28px; }
  .bar {
    position: relative;
    width: 100%;
    height: 8px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .bar-fill {
    position: absolute;
    left: 0; top: 0; height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .bar-target {
    position: absolute;
    top: 0; height: 100%;
    width: 2px;
    background: var(--target);
    transform: translateX(-1px);
  }
  .bar-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    font-family: var(--mono);
  }
  .bar-labels .now { color: var(--accent); }
  .bar-labels .target { color: var(--target); }
  .bar-labels .end { color: var(--text-faint); }

  .result {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--panel-border);
  }
  .result-label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .result-value {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
  }
  .result-time {
    font-size: 30px;
    font-weight: 500;
    color: var(--text);
    font-family: var(--mono);
  }
  .result-date { font-size: 14px; color: var(--text-dim); }
  .result-msg { font-size: 14px; color: var(--text); }

  .steps-toggle {
    margin-top: 18px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    font-family: var(--sans);
  }
  .steps-box {
    margin-top: 12px;
    background: var(--track);
    border-radius: 6px;
    padding: 14px 16px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    display: none;
  }
  .steps-box.open { display: block; }
  .step-line {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 3px 0;
  }
  .step-line span:last-child { color: var(--text); }
</style>
</head>
<body>

<div class="panel">
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4FD1C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 12 8 9"/><path d="M12 4v2"/></svg>
    <h1>Progress reach-time calculator</h1>
  </div>
  <p class="subtitle">Assumes the percentage climbs at a constant rate from now until it hits 100%.</p>

  <label class="field">
    <span class="field-label">Current time &amp; date</span>
    <input type="datetime-local" id="currentTime" />
  </label>

  <label class="field">
    <span class="field-label">Current percentage</span>
    <div class="input-wrap">
      <input type="number" step="0.1" id="currentPercent" class="pct-input" value="9.6" />
      <span class="pct-sign">%</span>
    </div>
  </label>

  <label class="field">
    <span class="field-label">Time &amp; date it reaches 100%</span>
    <input type="datetime-local" id="endTime" />
  </label>

  <label class="field">
    <span class="field-label">Target percentage</span>
    <div class="input-wrap">
      <input type="number" step="0.1" id="targetPercent" class="pct-input" value="65" />
      <span class="pct-sign">%</span>
    </div>
  </label>

  <div class="bar-wrap">
    <div class="bar">
      <div class="bar-fill" id="barFill"></div>
      <div class="bar-target" id="barTarget"></div>
    </div>
    <div class="bar-labels">
      <span class="now" id="nowLabel">now · 0%</span>
      <span class="target" id="targetLabel">target · 0%</span>
      <span class="end">100%</span>
    </div>
  </div>

  <div class="result" id="result"></div>

  <div id="stepsSection" style="display:none;">
    <button class="steps-toggle" id="stepsToggle">
      <svg id="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      <span id="stepsToggleText">Show calculation</span>
    </button>
    <div class="steps-box" id="stepsBox"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);

  function toLocalInputValue(date) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }
  function formatReadable(date) {
    const time = date.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    const day = date.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    return { time, day };
  }

  const now = new Date();
  const later = new Date(now.getTime() + 24*60*60*1000);
  $("currentTime").value = toLocalInputValue(now);
  $("endTime").value = toLocalInputValue(later);

  let stepsOpen = false;

  function calculate() {
    const cur = parseFloat($("currentPercent").value);
    const tgt = parseFloat($("targetPercent").value);
    const t0 = new Date($("currentTime").value);
    const t1 = new Date($("endTime").value);

    const resultEl = $("result");
    const stepsSection = $("stepsSection");
    stepsSection.style.display = "none";

    // update bar
    const curClamped = isNaN(cur) ? 0 : Math.min(100, Math.max(0, cur));
    const tgtClamped = isNaN(tgt) ? 0 : Math.min(100, Math.max(0, tgt));
    $("barFill").style.width = curClamped + "%";
    $("barTarget").style.left = tgtClamped + "%";
    $("nowLabel").textContent = `now · ${curClamped}%`;
    $("targetLabel").textContent = `target · ${tgtClamped}%`;

    if (isNaN(cur) || isNaN(tgt) || isNaN(t0.getTime()) || isNaN(t1.getTime())) {
      resultEl.innerHTML = `<p class="result-msg" style="color:var(--text-dim)">Fill in every field to calculate.</p>`;
      return;
    }
    if (cur < 0 || cur > 100 || tgt < 0 || tgt > 100) {
      resultEl.innerHTML = `<p class="result-msg" style="color:var(--text-dim)">Percentages must be between 0 and 100.</p>`;
      return;
    }
    const remainingMinutes = (t1.getTime() - t0.getTime()) / 60000;
    if (remainingMinutes <= 0) {
      resultEl.innerHTML = `<p class="result-msg" style="color:var(--text-dim)">The 100% time must be after the current time.</p>`;
      return;
    }
    const remainingPercent = 100 - cur;
    if (remainingPercent <= 0) {
      resultEl.innerHTML = `<p class="result-msg" style="color:var(--text-dim)">Current percentage is already at or above 100%.</p>`;
      return;
    }
    const rate = remainingPercent / remainingMinutes;

    if (tgt <= cur) {
      resultEl.innerHTML = `<p class="result-msg">Already past ${tgt}% at the current time — current percentage is higher than the target.</p>`;
      return;
    }

    const neededPercent = tgt - cur;
    const minutesNeeded = neededPercent / rate;
    const targetDate = new Date(t0.getTime() + minutesNeeded * 60000);
    const { time, day } = formatReadable(targetDate);

    resultEl.innerHTML = `
      <div class="result-label">Reaches ${tgt}% at</div>
      <div class="result-value">
        <span class="result-time">${time}</span>
        <span class="result-date">on ${day}</span>
      </div>
    `;

    stepsSection.style.display = "block";
    $("stepsBox").innerHTML = `
      <div class="step-line"><span>Time left to 100%</span><span>${remainingMinutes.toFixed(1)} min</span></div>
      <div class="step-line"><span>Percent left to 100%</span><span>${remainingPercent.toFixed(2)}%</span></div>
      <div class="step-line"><span>Rate</span><span>${rate.toFixed(5)}%/min</span></div>
      <div class="step-line"><span>Percent needed for ${tgt}%</span><span>${neededPercent.toFixed(2)}%</span></div>
      <div class="step-line"><span>Time needed</span><span>${minutesNeeded.toFixed(1)} min</span></div>
    `;
    $("stepsBox").classList.toggle("open", stepsOpen);
  }

  $("stepsToggle").addEventListener("click", () => {
    stepsOpen = !stepsOpen;
    $("stepsBox").classList.toggle("open", stepsOpen);
    $("stepsToggleText").textContent = stepsOpen ? "Hide calculation" : "Show calculation";
    $("chevron").style.transform = stepsOpen ? "rotate(180deg)" : "rotate(0deg)";
  });

  ["currentTime","currentPercent","endTime","targetPercent"].forEach(id => {
    $(id).addEventListener("input", calculate);
  });

  calculate();
</script>

</body>
</html>
